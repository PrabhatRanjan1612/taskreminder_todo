{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo</title>
    <link rel="icon" href="{% static "todo/logo.png" %}">
    <link rel="stylesheet" href=" {% static "todo/Task.css" %} ">
</head>
<body>
    <div class="logo">
        <img src="{% static "todo/logo.png" %}" alt="logo">
    </div>
    <div class="contant">
        {% include "todo/includes/nav.html" %}
        <div class="cont_body">
            <h2>Task Reminder Web-Applications</h2>
            <h3>Add New Task</h3>
            <div class="addtask">
                <form action=" {% url "addtask" %} " method="POST">
                    {% csrf_token %}
                    <label for="title">Title:</label>
                    <input type="text" name="title" id="title" required maxlength="150">
                    <label for="description">Description:</label>
                    <textarea name="descri" id="description"></textarea>
                    <label for="date">Due_date:</label>
                    <input type="date" name="date" id="date" required>
                    <button type="submit">Add</button>
                </form>
                {% if msg %}
                    <div class="msg">
                        {{msg}}
                    </div>      
                {% endif %}

            </div>

        </div>
    </div>
</body>
</html>
