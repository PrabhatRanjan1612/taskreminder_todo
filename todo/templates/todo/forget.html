{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pass_reset-todo</title>
    <link rel="icon" href="{% static "todo/logo.png" %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="{% static "todo/forget.css" %}">
</head>
<body>
    <div class="contan">
        {% if messages %}
            {% for message in messages %}
                <div class="{% if 'error' in message.tags %}errmsg{% else %}succ_msg{% endif %} ">
                <p>{{message}} </p>
                </div>
            {% endfor %}
        {% endif %}
        <div class="inner">
            <div class="loginimg">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div class="form_login">
                <form action=" {% url "forget_pass" %}" , method="POST">
                    {% csrf_token %}
                    <input type="text" placeholder="USER-NAME" name="old_user" id="user_name" required maxlength="50">
                    <input type="password" name="new_pass" id="user_pass" placeholder="NEW-PASSWORD" required maxlength="50">
                    
                    <div class="btn">
                        <a href=" {% url "login_user" %} " id="back"><i class="fa-solid fa-arrow-left"></i></a>
                        <button type="submit" id="btn_login">Submit</button>
                        {% if messages %}
                        <span id="new_user"><a href=" {% url "login_user" %} ">Login</a></span>
                        <span id="new_user"><a href=" {% url "register_user" %} ">New User</a></span>
                        {% endif %}
                    </div>
                </form>
            </div>
            
        </div>
    </div>
</body>
</html>
