{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <link rel="icon" href="{% static "todo/logo.png" %} ">
    <link rel="stylesheet" href=" {% static "todo/viewTask.css" %} ">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="main_contant">
        {% include "todo/includes/nav.html" %}
        <div class="Tasklayout">
            <h2 id="titel">Tasks</h2>
            <div class="taskscon">
                {% for task in tasks %}
                    <div class="taskcon">
                        <div><p><a href=" {% url "task_details"  task.id%} "> {{task.title}} </a></p></div>   <!--change text-->
                        <div>
                        <a href=" {% url "updateTask" task.id %} "> <i class="fa-solid fa-file-pen"></i> </a>
                        <a href=" {% url "taskupdate" task.id %} "> <i class="fa-solid fa-circle-check"></i> </a>  <!--link-->
                        <a href=" {% url "tasktrash" task.id %} "> <i class="fa-solid fa-trash"></i> </a>  <!--link-->
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
    {% if msg %}
        <script>
            alert(" {{msg}} ")
        </script>
    {% endif %}
</body>
</html>
